name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: auth_test
          POSTGRES_DB: shoe_beta_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_test -d shoe_beta_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Build Next.js
        run: npm run build

      - name: Test private account data
        run: npm run test:auth
        env:
          TEST_DATABASE_URL: postgresql://auth_test:auth_test@127.0.0.1:5432/shoe_beta_auth_test

      - name: Test shop search
        run: npm run test:shops
